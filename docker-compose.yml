services:
  # ── MetaMCP App ──────────────────────────────────────────────────────────
  app:
    container_name: metamcp
    build:
      dockerfile: Dockerfile.update
      context: .
    env_file: .env
    ports:
      - "12008:12008"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3t4mcp}
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-metamcp_user}:${POSTGRES_PASSWORD:-m3t4mcp}@postgres:5432/${POSTGRES_DB:-metamcp_db}"
      APP_URL: http://localhost:12008
      NEXT_PUBLIC_APP_URL: "http://localhost:12008"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: ${TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      # - ${DOCUMENTS_PATH:-./data/documents}:/data/documents
      # - ${PROJECTS_PATH:-./data/projects}:/data/projects
      - ${USER_PATH:-C:\\Users\\jsalm}:/mnt
      # - /var/run/docker.sock:/var/run/docker.sock # maybe allow docker stdio integrations?
      - ./mcp-assets/:/mcp-assets # serve kairn to here?
      # Persist the uv cache across container recreates. Without this, every
      # `docker compose up -d`/recreate wipes the writable layer and the next
      # `uvx <pkg>@latest` spawn for each STDIO server cold-installs from
      # scratch — slow enough to trip the crash detector and stick the server
      # in error_status=ERROR. The image ships /home/nextjs/.cache/uv owned by
      # nextjs (uid 1001) so a fresh named volume inherits correct ownership.
      - uv_cache:/home/nextjs/.cache/uv
      - nextjs:/home/nextjs
    networks:
      - metamcp-network

  # ── Postgres + pgvector ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: metamcp-pg
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3t4mcp}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-9433}:5432"
    volumes:
      - ./pg-init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metamcp_user} -d ${POSTGRES_DB:-metamcp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - metamcp-network

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uv_cache:
    driver: local
  nextjs:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  metamcp-network:
    driver: bridge