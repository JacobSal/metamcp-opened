services:
  # ── MetaMCP App ──────────────────────────────────────────────────────────
  app:
    container_name: metamcp
    build:
      dockerfile: Dockerfile.update
      context: .
    env_file: .env
    ports:
      - "12008:12008"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3t4mcp}
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-metamcp_user}:${POSTGRES_PASSWORD:-m3t4mcp}@postgres:5432/${POSTGRES_DB:-metamcp_db}"
      # APP_URL: ${APP_URL:-http://localhost:12008}
      APP_URL: http://localhost:12008
      NEXT_PUBLIC_APP_URL: "http://localhost:12008"
      # NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:12008}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: ${TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL:-true}
    volumes:
      # - ${DOCUMENTS_PATH:-./data/documents}:/data/documents
      # - ${PROJECTS_PATH:-./data/projects}:/data/projects
      - ${USER_PATH:-./mnt/}:/mnt
      # - /var/run/docker.sock:/var/run/docker.sock # maybe allow docker stdio integrations?
      - /kairn/brain:/kairn/brain # serve kairn to here?
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - metamcp-network

  # ── Postgres + pgvector ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: metamcp-pg
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3t4mcp}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-9433}:5432"
    volumes:
      - ./pg-init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metamcp_user} -d ${POSTGRES_DB:-metamcp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - metamcp-network

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  ollama_data:
  open_webui:

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  metamcp-network:
    driver: bridge