services:

  # ── Ollama ───────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    entrypoint: bash /entrypoint-ollama.sh
    env_file: .env
    ports:
      - "11434:11434"
    environment:
      # Model Configuration
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}

      # GPU Optimization for GTX 3080 Ti (12GB) + GTX 1060 (3GB)
      # Allow both GPUs to be used
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0,1}

      # GPU Memory Management
      # 2GB overhead for 3080 Ti (high-end card with more features)
      OLLAMA_GPU_OVERHEAD: ${OLLAMA_GPU_OVERHEAD:-2048}

      # Flash Attention for better memory efficiency with larger context
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}

      # Parallel inference requests - balanced for 12GB VRAM
      # gemma4:e4b is ~7GB, allows ~1-2 parallel requests
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}

      # Context window optimization
      # gemma4 supports up to 32k context, but scaled for VRAM constraints
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}

      # Maximum models to keep loaded in VRAM
      # With 12GB, keep 1-2 models loaded
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}

      # Thread optimization for CPU context
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-16}

      # Memory optimization flags
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}

      # LLM Inference settings
      # num_gpu controls how many layers run on GPU (not number of GPUs)
      # For gemma4:e4b with 12GB, offload most layers to GPU
      OLLAMA_LLM_NUM_GPU: ${OLLAMA_LLM_NUM_GPU:-999}

      # Reduce context length for lower VRAM footprint if needed
      # OLLAMA_NUM_CTX: 4096  # Uncomment for tighter VRAM constraints

      # Debug/Monitoring (set to 1 to enable detailed logging)
      OLLAMA_DEBUG: ${OLLAMA_DEBUG:-0}

      # Resource limits
      OLLAMA_VERBOSE: ${OLLAMA_VERBOSE:-false}
    volumes:
      - ollama_data:/root/.ollama
      - ./entrypoint-ollama.sh:/entrypoint-ollama.sh:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']  # Use both GTX 3080 Ti (0) and GTX 1060 (1)
              capabilities: [gpu]
        limits:
          memory: 16G  # Limit container memory to prevent system swap
    networks:
      - metamcp-network

  # ── Open WebUI ───────────────────────────────────────────────────────────
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.9.0
    container_name: webui
    env_file: .env
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      # Ollama
      OLLAMA_BASE_URL: "http://ollama:11434"
      USE_OLLAMA_DOCKER: false
      # APP_URL: ${APP_URL:-http://app:12008}
      APP_URL: "http://app:12008"
      PG_URL: "http://postgres:5432"
      USE_CUDA_DOCKER: true
      DOCKER: true
      # USE_OLLAMA: false # Force disable Ollama integration (for testing without Ollama or if using a different LLM provider)
      # Embedding / reranking
      RAG_EMBEDDING_BATCH_SIZE: 16
      RAG_EMBEDDING_ENGINE: "ollama"
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      RAG_RERANKING_MODEL: ${RAG_RERANKING_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      HF_TOKEN: ${HF_TOKEN:-}
      # Postgres — main app DB and vector DB are separate
      VECTOR_DB: pgvector
      DATABASE_URL: "postgresql://${POSTGRES_USER:-metamcp_user}:${POSTGRES_PASSWORD:-m3t4mcp}@postgres:5432/${POSTGRES_OPENWEBUI_DB:-openwebui_db}"
      PGVECTOR_DB_URL: "postgresql://${POSTGRES_USER:-metamcp_user}:${POSTGRES_PASSWORD:-m3t4mcp}@postgres:5432/${POSTGRES_OPENWEBUI_VECTORS_DB:-openwebui_vectors}"
      PGVECTOR_CREATE_EXTENSION: false # Set to true if the pgvector extension is not already created in the Postgres container
      # Admin bootstrap (change in .env for production)
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-admin@localhost}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-admin}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-admin}
    volumes:
      # - open_webui:/var/lib/.openwebui
      - open_webui:/app/backend/data
      # - ${DOCUMENTS_PATH:-./mnt/documents}:/mnt/documents
      # - ${PROJECTS_PATH:-./mnt/projects}:/mnt/projects
      - ${USER_PATH:-./mnt/}:/mnt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_started
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - metamcp-network

  # ── MetaMCP App ──────────────────────────────────────────────────────────
  app:
    container_name: metamcp
    build:
      dockerfile: Dockerfile.update
      context: .
    env_file: .env
    ports:
      - "12008:12008"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3t4mcp}
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-metamcp_user}:${POSTGRES_PASSWORD:-m3t4mcp}@postgres:5432/${POSTGRES_DB:-metamcp_db}"
      # APP_URL: ${APP_URL:-http://localhost:12008}
      APP_URL: http://localhost:12008
      NEXT_PUBLIC_APP_URL: "http://localhost:12008"
      # NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:12008}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: ${TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL:-true}
    volumes:
      # - ${DOCUMENTS_PATH:-./data/documents}:/data/documents
      # - ${PROJECTS_PATH:-./data/projects}:/data/projects
      - ${USER_PATH:-./mnt/}:/mnt
      - /var/run/docker.sock:/var/run/docker.sock # maybe allow docker stdio integrations?
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - metamcp-network

  # ── Postgres + pgvector ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: metamcp-pg
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3t4mcp}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-9433}:5432"
    volumes:
      - ./pg-init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metamcp_user} -d ${POSTGRES_DB:-metamcp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - metamcp-network

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  ollama_data:
  open_webui:

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  metamcp-network:
    driver: bridge